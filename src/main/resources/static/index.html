<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <header>
        <h1>User Management System</h1>
        <p>CRUD Operations for Users</p>
    </header>

    <main>
        <!-- Create/Update User Form -->
        <section class="form-section">
            <div class="form-container">
                <h2>Add/Edit User</h2>
                <form id="userForm">
                    <div class="form-group">
                        <label for="userId">User ID:</label>
                        <input type="number" id="userId" placeholder="Enter user ID" required>
                    </div>
                    <div class="form-group">
                        <label for="userName">Name:</label>
                        <input type="text" id="userName" placeholder="Enter user name" required>
                    </div>
                    <div class="form-group">
                        <label for="userEmail">Email:</label>
                        <input type="email" id="userEmail" placeholder="Enter email" required>
                    </div>
                    <div class="form-group">
                        <label for="userAge">Age:</label>
                        <input type="number" id="userAge" placeholder="Enter age" min="1" max="150" required>
                    </div>
                    <div class="button-group">
                        <button type="button" id="createBtn" class="btn btn-primary">Create User</button>
                        <button type="button" id="updateBtn" class="btn btn-warning">Update User</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>
            </div>

            <!-- Search Section -->
            <div class="search-container">
                <h3>Search Users</h3>
                <div class="search-group">
                    <input type="text" id="searchName" placeholder="Search by name..." class="search-input">
                    <input type="email" id="searchEmail" placeholder="Search by email..." class="search-input">
                    <button id="searchBtn" class="btn btn-info">Search</button>
                    <button id="showAllBtn" class="btn btn-secondary">Show All</button>
                </div>
            </div>
        </section>

        <!-- Users List Section -->
        <section class="users-section">
            <h2>Users List</h2>
            <div id="loading" class="loading" style="display: none;">Loading...</div>
            <div id="message" class="message"></div>

            <div class="table-responsive">
                <table class="users-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    <tr class="empty-row">
                        <td colspan="5">No users found. Create one to get started!</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 User Management System | Spring Boot + Vanilla JS</p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
